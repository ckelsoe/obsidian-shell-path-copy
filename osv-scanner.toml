# OSV-Scanner suppressions. Every entry must document why the advisory is
# accepted and what would let us drop it. Revisit whenever the dependency tree
# changes (a new lockfile may remove the transitive path entirely).
#
# One active suppression, below: minimatch through type-coverage-core. The
# deepmerge advisory left with Jest (2026-11-11): Vitest does not use
# deepmerge. Every other minimatch 9/10 copy is moved to 11 through
# version-keyed `overrides` (`minimatch@9`, `minimatch@10`), which leave
# eslint's own 3.x copies alone. The glob advisory is fixed through
# `overrides` (2026-11-04). The braces entry was dropped 2026-11-04 (GitHub
# withdrew GHSA-vfj7-8cjw-p6xm on 2026-10-23). The other dev-only transitive
# advisories are FIXED rather than ignored: the package.json `overrides` block
# pins each dependency to a patched version.
#
# Add an [[IgnoredVulns]] entry here only for an advisory with no non-breaking
# fix, and document why and what would let us drop it.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31
reason = "minimatch: denial of service when a crafted glob pattern is compiled with optimizationLevel 2 or higher. Affects 7.0.0 up to 11.0.1. One copy remains: minimatch 10.2.6 under type-coverage-core, which requires '6 || 7 || 8 || 9 || 10' (2.31.2, the latest, still does). npm 10, the version CI runs, does not apply the `minimatch@10` override to that range, and a lockfile written by a newer npm that does apply it fails `npm ci` on CI. A nested override is banned in this workspace. Dev-only: type-coverage matches this repo's own source paths; nothing ships in main.js. This entry is by advisory id, so the short expiry forces a re-check. Drop it when type-coverage-core accepts minimatch 11 or CI moves to an npm that applies the override."
